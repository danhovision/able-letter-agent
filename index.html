const PHILOSOPHY_POOL = [
// ── 기존 칼럼/더나은미래/더버터 16개 ──────────────────────────
"\"처음의 시도가 어색하지, 우리가 살아갈 시대에 임팩트란 더 이상 어색하지 않은 시대가 되었다.\" [전남일보 2022.12]", "\"모든 벤처가 임팩트를 지향해야 생존한다.\" [한겨레 2019.12]", "\"비즈니스란 수익 창출을 넘어서 보이지 않는 사회환경적 가치도 함께 창출해야 진짜 비즈니스다.\" [전남일보 2022.12]", "\"소셜이란 단어가 필요 없는 시대가 온다. 모든 기업이 사회적 가치를 내재화해야 생존하는 시대가 우리 앞에 있다.\" [한겨레 2019.12]", "\"무한게임의 주목적은 게임을 계속해 나가며 그 게임을 오랫동안 유지하는 것이다.\" [더나은미래 2023.04]", "\"유일함(Only)이 최고(Best)를 이긴다.\" [전남일보 2021.04]", "\"회사나 조직의 이름으로 유명하기보다, 누군가가 근무하는 회사나 조직으로 유명해지는 시대가 더욱 가까워지고 있다.\" [전남일보 2021.07]", "\"대표나 창업가의 삶이란 끝날 기미가 없는 전쟁을 해가면서도 개인의 삶은 지속하는 이중성이다.\" [더나은미래 2023.04]", "\"상상력과 창의성은 기업의 정관이나 전략문서에서 나오지 않는다. 그 모든 근원은 바로 사람에서 비롯된다.\" [전남일보 2021.07]", "\"두려움의 반대말은 두렵지 않은 상태가 아니라 바로 사랑이었다.\" [더나은미래 2023.10]", "\"유리하다고 느끼는 순간이 오히려 위험해지고, 경험이 많아질수록 판단은 흐려지며, 익숙한 방식이 때로는 가장 큰 장애물이 된다.\" [더버터 2025.11]", "\"자기허락이 없이는 불가능한 길이 있다.\" [더버터 2025.09]", "\"임팩트투자를 하며 울음을 터뜨린 건 이번이 처음이었다.\" [더나은미래 2023.06]", "\"10년 전 MYSC는 자본전액잠식을 경험했다. 한국에서 사회혁신과 임팩트투자는 과연 지속가능할까란 질문이 진실에 가까웠다.\" [더나은미래 2023.08]", "\"가장 큰 복리효과가 기대되는 투자는 관계에 대한 투자다.\" [더나은미래 2025.12]", "\"협력의 어려움은 정답이 하나라는 가정에서 출발한다.\" [더나은미래 2025.03]",
// ── 소셜이노베이터 책 16개 ────────────────────────────────────
"\"지금 잠시 잡고 있는 황금 지팡이가 사실은 만원 지하철에서 운이 좋아 잡고 있는 플라스틱 손잡이임을 잊지 말라.\" [소셜이노베이터 책]", "\"왜라는 질문을 포기하지 않으면, 불현듯 언젠가 왜 안돼의 단계로 나아간다.\" [소셜이노베이터 책]", "\"이성적인 사람은 자신을 세상에 적응시킨다. 하지만 비이성적인 사람은 고집스럽게 세상을 자신한테 적응시키려 한다. 그래서 모든 진보는 비이성적인 사람의 손에 달려 있다.\" [소셜이노베이터 책]", "\"어떤 문제건 그 문제를 만들어 낸 생각과 동일한 수준으로 접근해서는 문제를 해결할 수 없다.\" [소셜이노베이터 책]", "\"환승이야말로 소셜이노베이터를 나타내는 특별한 키워드다. 당신은 어떤 환승을 경험했는가?\" [소셜이노베이터 책]", "\"거대한 문제 앞에서도 내가 할 수 있는 것이 있다고 생각하는 것, 그것이 소셜이노베이터의 출발점이다.\" [소셜이노베이터 책]", "\"전례가 없고 사례가 없다는 현실에 막막함보다는 도전의식을 느끼는 사람이 세상을 바꾼다.\" [소셜이노베이터 책]", "\"재조합적 이노베이션을 위해서는 다방면에 걸친 역사와 기술변화를 알아가는 것이 필요하다. 폭넓은 독서와 시사상식은 재조합 역량을 강화시키는 좋은 습관이 된다.\" [소셜이노베이터 책]", "\"나 혼자보다는 팀과 함께 할 때 혁신능력이 강화된다. 소셜이노베이션은 결국 함께하는 여정이다.\" [소셜이노베이터 책]", "\"왜 가난한 사람을 위한 은행은 없는 것일까? 왜 꼭 영리와 비영리의 가치를 구분해서 접근해야 할까? 이 질문이 세상을 바꿨다.\" [소셜이노베이터 책]", "\"소셜이노베이터는 자신의 삶에 알게 모르게 그어져 있던 하얀 선을 하나씩 발견하고, 그 선을 넘어가는 노력을 취한다.\" [소셜이노베이터 책]", "\"소셜이노베이터는 큰 행동에 앞서 작은 행동의 가치를 아는 사람이다.\" [소셜이노베이터 책]", "\"거인의 어깨에 올라서는 순간, 내게 감히 꿈꾸지 못했던 기회들이 열리기 시작했다.\" [소셜이노베이터 책]", "\"큰 기회에 앞서 작은 기회가, 큰 도전에 앞서 작은 도전이 필요하다.\" [소셜이노베이터 책]", "\"결과와 상관없이 문제해결 과정에서 열정과 창의력이 분출될 때, 그것이 진짜 소명의 신호다.\" [소셜이노베이터 책]", "\"평소 수많은 분야에 관심이 많아 하나에 집중하지 못한다는 이야기를 듣는가? 그것이 소셜이노베이터의 자산이다.\" [소셜이노베이터 책]",
// ── CEO 급여명세서 30개 ──────────────────────────────────────
"\"수영 기술을 배우는 것 자체가 목적이 되는 순간 왜 힘들게 살아야 하나 고민이 든다. 하지만 그 너머의 가치를 생각할 때 지금 배우는 것은 새로운 의미를 가진다.\" [CEO 급여명세서]", "\"피곤하니 운동 못하겠다는 논리는 사실과 다른 핑계일 뿐이다. 얼마든지 피곤하니 운동을 더 해야겠다고도 생각할 수 있다.\" [CEO 급여명세서]", "\"누군가의 배려와 호의는 나의 권리가 아니다.\" [CEO 급여명세서]", "\"티끌에서 태산을 보듯, 작은 일에서도 큰 일이 가능하다.\" [CEO 급여명세서]", "\"현재의 문법이 아닌 미래의 문법을 따라가는 것, 그것이 우리가 지금 이 자리에 있는 이유다.\" [CEO 급여명세서]", "\"이건 예전 경험이 없으니 오히려 제약 없이 더 잘 될 것 같다. 주어진 자원이 부족하니 더 창의적으로 해보자.\" [CEO 급여명세서]", "\"작은 흘려 보내는 노력이 우리를 고이지 않고 썩지 않는 생명력 있는 물이 되도록 돕는다.\" [CEO 급여명세서]", "\"30초의 소중한 시간 앞에, 우리는 늘 선택을 한다. 그 선택이 모여 우리의 여정이 된다.\" [CEO 급여명세서]", "\"우리 답지 않은 것을 남들이 먼저 발견하기 전에, 스스로 먼저 발견하고 변화해야 한다.\" [CEO 급여명세서]", "\"진실되고, 사랑하며, 내게 주어진 축복을 나누며, 내게 맡겨진 기회에 책임지며 살아가는 삶이 아닐까.\" [CEO 급여명세서]", "\"개인의 성장욕구가 분명한 사람은 조직이 돕고 존귀케 할 수 있다. 성장은 강제할 수 없지만 촉진할 수는 있다.\" [CEO 급여명세서]", "\"과거로 다시 돌아갈 30초의 기회가 주어진다면 무엇을 바꾸고 싶은가? 그 대답이 오늘 우리가 집중해야 할 것을 알려준다.\" [CEO 급여명세서]", "\"아빠, 나랑 놀자. 그 말 한마디가 때로는 가장 중요한 우선순위를 일깨워준다.\" [CEO 급여명세서]", "\"봄이 찾아왔다. 겨울에서 봄으로의 전환처럼, 우리에게도 새로운 생각의 전환이 필요하다.\" [CEO 급여명세서]", "\"우리가 왜 이렇게 열심히 몰입하며 성장해가는지를 제대로 이해하려면 그 너머의 가치와 변화를 잊지 말아야 한다.\" [CEO 급여명세서]", "\"연세가 70세가 되는 분이 새벽 비행기에서 내려 먼저 운동을 챙기시다니. 그 모습이 내 고정된 생각을 점검하는 계기가 되었다.\" [CEO 급여명세서]", "\"자유가 베푼 혼란과 부작용에 스스로 혐오를 느낄 때, 그것이 오히려 성장의 신호일 수 있다.\" [CEO 급여명세서]", "\"리더로서 시행착오와 회고는 부끄러운 것이 아니다. 더 신뢰를 주는 조직이 되기 위한 과정이다.\" [CEO 급여명세서]", "\"논문 한 편이 내 삶의 방향을 바꾼 적이 있다. 지식은 때로 예상치 못한 순간에 길을 열어준다.\" [CEO 급여명세서]", "\"수고한 한 달을 돌아보며, 우리가 흘려 보낸 땀방울이 모여 더 큰 흐름을 만든다는 것을 기억하길 바란다.\" [CEO 급여명세서]", "\"판매 결과와 상관없이, 전례가 있든 없든, 중요한 것은 우리가 여전히 가야 할 길을 멈추지 않는 것이다.\" [CEO 급여명세서]", "\"내가 대접받고 싶은 대로 남을 대접하라는 황금률은 기술이 아닌 관계에 대한 것임을 명심할 필요가 있다.\" [CEO 급여명세서]", "\"주변에서 MYSC로 가라는 이야기를 들었다며 찾아오는 사람들. 그 한마디 한마디가 우리가 가는 방향이 맞다는 신호다.\" [CEO 급여명세서]", "\"스타트업 경진대회 설명회에서 나눈 작은 만남이 몇 년 후 큰 협력으로 이어진다. 관계의 복리효과는 언제나 예상을 뛰어넘는다.\" [CEO 급여명세서]", "\"고객과 함께하는 현장, 그 작은 경험들이 쌓여 MYSC라는 조직의 이야기가 된다.\" [CEO 급여명세서]", "\"앞으로 승리하는 조직은 재즈 앙상블과 같을 것이다. 악보가 아닌 상황과 호흡에 따라 함께 움직이는 것.\" [CEO 급여명세서]", "\"콜링은 논리적이지 않다. 합리적이지도 않다. 그러나 바로 그 역설 때문에 체인지메이커들은 자기허락의 카드를 꺼내든다.\" [CEO 급여명세서]", "\"임팩트를 측정할 수 없다면, 임팩트를 관리할 수 없다. 그러나 측정만이 전부인 것처럼 착각해서도 안 된다.\" [CEO 급여명세서]", "\"좋은 조직은 구성원 각자의 삶을 더 풍요롭게 만드는 데 기여한다. 그것이 MYSC가 지향하는 방향이다.\" [CEO 급여명세서]", "\"2018년은 MYSC에게 1차 리즈 시절이었다. 처음으로 단체복을 입고, 처음으로 비행기를 타고 워크숍을 다녀왔다. 작은 시작이 쌓여 지금이 되었다.\" [CEO 급여명세서]",
// ── 독서 인사이트 34개 ───────────────────────────────────────
"\"고통은 우리가 다른 사람을 찾게 하는 가장 강한 힘이며, 다른 인간이야말로 인간이 발명한 첫 번째 진통제이다.\" [손절사회 — 이승연]", "\"인간은 자신을 바라보기 위해 타인이라는 거울을 필요로 한다.\" [필연적 혼자의 시대 — 김수영]", "\"손절사회란 정서적 건강을 인간관계의 궁극적 목적으로 여기며, 무해한 관계를 이상적 관계로 여기게 된 사회다.\" [손절사회 — 이승연]", "\"타인을 전혀 필요로 하지 않는 완전히 독립적인 인물은 언제나 신자유주의의 이상적 인물상일 뿐이다.\" [손절사회 — 이승연]", "\"치료요법 문화는 정신적 고통을 피해야만 하는 병리로 평면화한다. 하지만 고통은 우리를 성장시키는 것으로도 받아들일 수 있다.\" [손절사회 — 이승연]", "\"자신을 돌보는 행위에 집착하는 문화에서 서로를 돌보는 행위의 중요성은 희미해진다.\" [손절사회 — 이승연]", "\"인간은 서로를 필요로 하는 존재다. 남에게 의존하는 상태가 취약성이 아니라, 오히려 인간다움의 본질이다.\" [필연적 혼자의 시대 — 김수영]", "\"회사가, 조직이, 커뮤니티가 서로가 서로에게 돌봄공동체가 되어주는 삶이 된다면 1인가구의 삶의 질은 달라질 수 있다.\" [필연적 혼자의 시대 — 김수영]", "\"인류학이 다른 인문사회과학과 다른 특징은 현장 관찰, 즉 당연하게 보이는 인간의 일상에 왜라는 질문을 던지는 것에 있다.\" [인류학자처럼 생각하는 법 — 매슈 엥글키]", "\"친숙한 것을 낯설게, 낯선 것을 친숙하게. 이것이 인류학자처럼 생각하는 법의 핵심이다.\" [인류학자처럼 생각하는 법 — 매슈 엥글키]", "\"에볼라 전염병 해결의 열쇠는 첨단 의료기술이 아니라, 지역의 장례 문화를 이해한 인류학자들의 현장 관찰에서 나왔다.\" [인류학자처럼 생각하는 법 — 매슈 엥글키]", "\"우리 사회가 안고 있는 아직 해결되지 않은 문제들은 대부분 적응 과제다.\" [타인과 일을 한다는 것 — 우다가와 모토카즈]", "\"타인과 일을 한다는 것은 기술적 과업이 아니다. 나와 너라는 세계의 차이를 인식하며, 그 간극에 관계성이라는 다리를 놓는 사회적 과업이다.\" [타인과 일을 한다는 것 — 우다가와 모토카즈]", "\"당신 또는 당신이 소속된 조직은 대화를 통해서 크게 강해질 것이다. 아니, 엄밀히 말하면 반취약적인 조직으로 변화해 갈 것이다.\" [타인과 일을 한다는 것 — 우다가와 모토카즈]", "\"돈을 사용하는 최고의 방법은 당신이 어떤 사람인지를 돈으로 정의하는 게 아니라, 당신이 되고자 하는 사람에 가까워지는 도구로 활용하는 것이다.\" [독서 인사이트 — 돈의 방정식]", "\"이제 자유 시장에 대한 투자는 저물고, 정부가 투자하는 곳에 자본이 몰리고 있다. 임팩트 투자로 수렴하는 거대한 강줄기가 형성되고 있다.\" [독서 인사이트 — 투자의 새로운 규칙]", "\"임팩트 투자는 오늘날 탁월한 투자자들이 미래에 투자하는 방식을 혁신하려고 활용하는 기법이다.\" [독서 인사이트 — 투자의 새로운 규칙]", "\"경험이력서만 제출해야 한다면, 기록할 수 있는 경험은 어떤 것일까? 학력이 아닌 경험이 말해주는 이야기가 있다.\" [경험수집가의 시대 — 바라트 아난드]", "\"경험수집가들에게서 두드러지는 특징은 나에게 관심이 많다는 점이다. 비교의 기준을 내려놓고 나 자신의 가능성을 끝까지 탐색하고 싶다는 마음.\" [경험수집가의 시대 — 바라트 아난드]", "\"상대방에게 관심을 표하고, 상대방이 관심있을 주제와 질문을 먼저 해보라. 누구나 내게 관심이 있는 사람을 만나고 싶다.\" [경험수집가의 시대 — 바라트 아난드]", "\"너를 만난 사람이 자리를 떠날 때 뭔가 자존감이 높아졌어, 내가 인정받았어라는 느낌을 갖도록 대화에 임하라.\" [경험수집가의 시대 — 바라트 아난드]", "\"지혜는 조용한 연구실보다 떠들썩한 광장과 길거리에서 발견될 확률이 높다.\" [소셜이노베이터 책]", "\"아직 초기 단계에 있는 한국의 임팩트 투자 시장. 금융의 거대한 강줄기와 어떤 합류를 할 수 있을까? 과연에서 언제로, 언제에서 어떻게로 질문이 구체화되고 있다.\" [독서 인사이트 — 투자의 새로운 규칙]", "\"인간은 의례를 갈망한다. 의례는 혼자가 아닌 함께일 때 완성된다.\" [인간은 의례를 갈망한다 — 코디 C. 데스트로셰]", "\"AI 시대에 인류학이 필요한 이유. 빅테크들이 인류학자를 고용하는 이유는 기술이 놓치는 인간의 맥락을 이해하기 위해서다.\" [인류학자처럼 생각하는 법 — 매슈 엥글키]", "\"1~2위의 어려움은 곧장 정신적 건강에도 큰 영향을 끼친다. 외로움은 개인의 문제가 아니라 사회의 과제다.\" [필연적 혼자의 시대 — 김수영]", "\"진정한 행동 변화는 정체성 변화에 있다.\" [임팩트 칼럼]", "\"돈이 내가 지향하는 가치를 실현하고 실행하도록 섬기게 할 것이다. 돈을 두려워하지 않게 되면, 돈을 버는 것도 두려워하지 않게 된다.\" [독서 인사이트 — 돈의 방정식]", "\"기술을 더 세련되게 하고 프로세스를 더 세심하게 만든다고 관계성이 형성되는 것은 아니다.\" [타인과 일을 한다는 것 — 우다가와 모토카즈]", "\"꼬리에 꼬리를 무는 독서. 한 권이 다음 한 권을 불러온다. 그렇게 세계가 넓어진다.\" [독서 인사이트]", "\"1인가구로 살 수 밖에 없는 수많은 사연의 사람들이 더 나은 삶의 질을 누릴 수 있도록. 그것이 사회혁신의 과제다.\" [필연적 혼자의 시대 — 김수영]",
// ── 임팩트 칼럼 10개 ────────────────────────────────────────
"\"기존의 정체성을 유지한 채 해결책 도출에만 집중했던 과거의 문법에서 벗어난다면 우리는 새로운 변화를 맞을 수 있다.\" [임팩트 칼럼]", "\"임팩트투자는 자본시장과 경제를 지배하는 거시적 기후가 어떻게 변화하고 있는지를 알려주는 지표산업과도 같다.\" [임팩트 칼럼]", "\"소비자로서 내가 내리는 일상의 선택이 곧 임팩트투자가 된다. 임팩트투자자로서 오늘 당신의 선택은 무엇인가?\" [임팩트 칼럼]", "\"의도성, 추가성, 측정성이라는 원칙은 더 좋은 기업, 더 탁월한 기업을 발굴하는 임팩트투자의 비결이다.\" [임팩트 칼럼]", "\"가장 지역적인 경험과 이야기가 가장 세계적인 경험과 이야기가 될 수 있다.\" [임팩트 칼럼]", "\"새로운 시대, 새로운 열매를 기대하기 위해서는 질문도 달라져야 한다. 성공할 수 있는 것이 아닌, 진짜 실패할 수 있을 만큼 무모하지만 혁신적인 것이 무엇인지 물어야 한다.\" [임팩트 칼럼]", "\"사회(social)는 외부로 향하는 창문이자, 내부로 향하는 거울이다. 창문을 통해 사회와 상호작용하고, 거울을 통해 조직문화를 반영한다.\" [임팩트 칼럼]", "\"세계를 다니다 보면 MYSC와 유사한 임팩트 부족을 종종 만나게 된다. 같은 방향을 바라보는 동료들이 세계 곳곳에 있다.\" [임팩트 칼럼]", "\"콜링은 논리적이지 않다. 합리적이지도 않다. 그러나 바로 그 역설 때문에 체인지메이커들은 자기허락의 카드를 꺼내든다.\" [임팩트 칼럼]", "\"더 넓고, 더 깊고, 더 오래가는 임팩트를 연결하고 확산시켜, 아시아 전체의 지속가능한 미래에 기여하는 것. 그 시작점은 함께하는 데 있다.\" [임팩트 칼럼]",
// ── 급여명세서 2권 추가 13개 ──────────────────────────────────
"\"가슴에 있는 팀 로고를 위해 노력할 때, 사람들은 당신 등에 있는 번호를 기억하게 될 것이다.\" [CEO 급여명세서]", "\"MYSC는 사회혁신이라는 광야에 나온 선지자이기에 MYSC의 길과 방식에 주목해야 합니다.\" [CEO 급여명세서]", "\"균형감각이란 양극단의 정확한 중간지점에 가만히 서 있는 것이 아니다. 진정한 균형감각은 양극단을 오고 가면서 끊임없이 최적점을 탐색해나가는 과정이다.\" [CEO 급여명세서]", "\"합동 연주에서는 늘 불협화음이 생길 위험이 있다. 이에 대한 해결책은 규율이다. 규율이란 서로를 알아차리고 배려하고 경청하며 기꺼이 의견 차이를 감수하는 일이다.\" [CEO 급여명세서]", "\"돈을 약속한 날짜에 잘 갚는다고 소문이 난 사람은 타인의 당장 쓸 일이 없는 돈을 마음대로 쓸 수 있다. 돈을 빌려준 사람은 빌린 사람보다 기억력이 훨씬 좋다.\" [CEO 급여명세서]", "\"원래 소통과 협력은 안 되는 게 지극히 정상이기 때문이다. 소통과 협력에는 어떤 형태로든 자기 희생이 수반된다.\" [CEO 급여명세서]", "\"일단 작업을 많이 해야 합니다. 오랫동안이요.\" 재능보다 오랜 시간의 축적이 시장에서 높은 평가를 받는 아티스트의 공통 패턴이었다. [CEO 급여명세서]", "\"스탠퍼드 학생 여러분 모두에게 충분한 고통과 시련이 있기를 바랍니다.\" 기대치가 너무 높은 사람들은 회복탄력성이 매우 낮다. 고통이 회복탄력성을 만든다. [CEO 급여명세서]", "\"바둑에서 가장 위험한 순간은 언제일까? 바로 이기고 있을 때다.\" [CEO 급여명세서]", "과거에는 한 분야의 전문가가 성공했다면, 이제는 여러 분야를 하나의 시스템으로 엮을 줄 아는 사람이 성공한다. 이 시대의 경쟁력은 분야를 잇는 시야에서 나온다. [CEO 급여명세서]", "\"AI가 진화하면 할수록, 우리가 더 신경을 써야 할 부분은 인지능력이 아닌 비인지능력이다.\" [CEO 급여명세서]", "정서적 연봉이란 금전적 보상 외에 직원이 얻을 수 있는 비금전적인 보상이다. 우리가 일터에서 받는 것은 숫자만이 아니다. [CEO 급여명세서]", "\"나는 내 삶을 살려고 여기에 있습니다.\" 자신이 사랑하는 것들 속에서 일상을 살아가는 것, 그것이 곧 소명이다. [CEO 급여명세서]",
// ── 독서 인사이트 추가 15개 ──────────────────────────────────
"\"사회 통념으로 보기에 산을 오르고 있었지만 정확히 그만큼 삶은 내 밑으로 떠내려가고 있었던 것이다.\" 톨스토이가 던지는 질문: 지금 내가 오르고 있는 것은 무엇인가? [독서 인사이트 — 이반 일리치의 죽음]", "\"인구를 부(wealth)라는 관점에서 보라. 인구는 해결해야 할 짐이 아니라, 더 나은 선택을 만들어낼 수 있는 자원이다.\" [독서 인사이트 — 인구에서 인간으로]", "\"사람 간의 상호작용 없이 발전하는 산업은 없다. 핵심은 사람의 수가 아니라, 사람들이 서로 어떻게 협업하는지에 있다.\" [독서 인사이트 — 인구에서 인간으로]", "\"바둑이 진짜 재미있어졌어요. 바둑을 둔 지 30년이 넘었는데 처음 20년보다 최근 8년이 더 재미있어요.\" AI 시대에 노력형 인재들이 오히려 혜택을 받고 있다. [독서 인사이트 — 먼저 온 미래]", "\"어떤 수가 왜 좋은 수인지는 알 수 없었다.\" 답을 아는 것과 그 이유를 아는 것은 다르다. 과정을 이해하는 사람이 결국 더 오래 간다. [독서 인사이트 — 먼저 온 미래]", "MYSC는 2015년 성수 시대를 시작했다. 꺼져가던 시절 받은 작은 투자 한 건이 포기하지 않을 이유가 되었다. 투자는 미래에 대한 인정이다. [독서 인사이트]", "성동임팩트펀드, 성동ESG펀드. 지방정부가 소셜벤처를 믿고 20억을 출자했다. 신뢰가 먼저 오면 생태계가 만들어진다. [독서 인사이트]", "\"여성으로서 겪는 불리함이 큰 직장의 여성 취업자는 결혼을 덜 하고, 아이를 갖지 않을 확률이 높아진다.\" 회사 문화가 인구의 미래를 결정한다. [독서 인사이트 — 인구에서 인간으로]", "\"이것은 단순한 인정 욕구와는 다르다. 비교의 기준 자체를 내려놓고 나 자신의 가능성을 끝까지 탐색하고 싶다는 마음에 가깝다.\" [경험수집가의 시대]", "\"이제 소비자의 첫 번째 탐색 대상은 상품이 아닌 자기 자신이 되었다. 유능한 조력자가 되어야 한다.\" [독서 인사이트 — 경험수집가의 시대]", "임직원 주식 소유 제도(ESOP). 직원들이 회사를 소유할 때, 일의 의미가 달라진다. 소유가 몰입을 만든다. [독서 인사이트 — 직원들이 회사를 샀다]", "\"서로를 지탱하는 관계의 자본, 신뢰와 연대 같은 사회적 자본, 다음 세대를 위한 기회와 가능성.\" 이것이 진짜 부(富)다. [독서 인사이트 — 인구에서 인간으로]", "\"좋아하는 사람과 자주 맛있는 음식을 먹어라. 미지의 영역에 도전하기가 확실히 쉬워질 것이다.\" 관계가 용기를 만든다. [독서 인사이트]", "인류학자처럼 현장을 관찰하라. 충분한 시간 동안 관계를 형성하고 일상에 호기심을 가진 사람만이 보이지 않는 실체를 파악할 수 있다. [인류학자처럼 생각하는 법 — 매슈 엥글키]", "\"전략으로 접근할 때 인구는 해결해야 할 짐이 아니라, 사회와 기업이 더 나은 선택을 만들어낼 수 있는 자원이 된다.\" [독서 인사이트 — 인구에서 인간으로]",
// ── 임팩트 칼럼 추가 8개 ─────────────────────────────────────
"\"더 넓고, 더 깊고, 더 오래가는 임팩트를 연결하고 확산시켜, 아시아 전체의 지속가능한 미래에 기여하는 것. 그 시작점은 함께하는 데 있다.\" [임팩트 칼럼]", "MYSC는 액셀러레이팅을 창업자와의 이중 상호작용이라 정의한다. 창업자와 관계를 맺고 배우며 함께 성장하는 것. 그것이 우리가 하는 일의 본질이다. [임팩트 칼럼]", "진정성 있게 가치를 추구하는 조직에는 실력 있는 사람이 알아서 찾아온다. 처음 들었을 때 믿기 어려웠던 그 말이 지금은 진실이 되고 있다. [임팩트 칼럼]", "콜링이란 알지 못하기에 시작할 수 있는 길이다. 만약 모든 것을 알았다면 과연 누가 이 길을 선택할 수 있었을까? [임팩트 칼럼]", "주주총회는 과거를 승인받는 자리가 아니다. 앞으로 어떤 회사가 될 것인지, 어떤 신뢰 위에 설 것인지를 보여주는 자리다. [임팩트 칼럼]", "아이들의 색칠공부 책처럼, 밑그림은 이렇게만 해야 된다는 지시가 아니다. 창의성을 초대하는 최소한의 질서다. [임팩트 칼럼]", "\"사실 나 역시 무의식적인 고정관념에서 자유롭지 않다. 이런 실수를 통해 나 역시 아직 가야 할 길이 멀다는 것을 깨닫는다.\" [임팩트 칼럼]", "세계를 다니다 보면 MYSC와 유사한 임팩트 부족을 종종 만나게 된다. 같은 방향을 바라보는 동료들이 세계 곳곳에 있다는 것, 그것만으로도 계속할 이유가 된다. [임팩트 칼럼]",
// ── 소셜이노베이터 책 추가 15개 ────────────────────────────
"새로운 시대는 새로운 인재상을 요구한다. 지금 이 시대가 원하는 인재상 중 하나는 바로 소셜이노베이터다. [소셜이노베이터 책]", "\"왜 장애가 있는 사람들은 특별함이 아닌 장애라는 관점에서만 이해될까?\" 이 질문 하나가 세상을 바꾸는 출발이 되었다. [소셜이노베이터 책]", "\"왜 생리대가 없어서 개발도상국 여자아이들은 학교를 빠질 수밖에 없을까?\" 불편함을 참지 않는 사람이 소셜이노베이터가 된다. [소셜이노베이터 책]", "소셜이노베이터가 반쯤 흥분한 상태로 느껴지는 이유가 있다. 자신이 문제라고 느끼는 주제에 뛰어들 때, 고통스러운 과정도 이들에게는 가슴 벅찬 경험이 되기 때문이다. [소셜이노베이터 책]", "유누스 교수와의 아침식사. 준비된 사람만이 우연한 기회를 잡을 수 있다. 나는 그날을 위해 미리 A4 한 장에 프로젝트 이름을 써두었다. [소셜이노베이터 책]", "\"돈의 액수가 중요한 게 아닙니다. 돈을 어디에 쓰고 얼마나 창의적인 방법으로 활용하는가가 더 중요합니다.\" [소셜이노베이터 책]", "혁신적인 경영전략으로서의 사회적기업은 누구나 채택할 수 있지만 아무나 채택하지 못하는 희귀한 블루오션 전략이다. 사회적기업은 결국 문화이자 세계관의 영역이기 때문이다. [소셜이노베이터 책]", "기술을 중심으로 한 이노베이션은 삶의 변화를 이끄는 속도에 탁월하지만, 인류의 삶이 가야 할 방향에 대해서는 가치중립적인 경향이 있다. 방향을 정하는 것이 소셜이노베이터의 역할이다. [소셜이노베이터 책]", "문제를 기회로 바꾸어 볼 수만 있다면 소셜이노베이터는 일상적인 문제에서 특별한 기회를 만들어낼 수 있다. 당신 주변에 있는 문제를 곰곰이 관찰해보라. [소셜이노베이터 책]", "민간토착적 이노베이션을 이루기 위해 소셜이노베이터는 전통과 문화에서 내려오는 지혜를 이해하고, 주변의 긍정적 이탈을 관찰하는 문화인류학적 역량을 개발해야 한다. [소셜이노베이터 책]", "잠수사의 원리를 적용해 잠수 쌀이라는 특별 품종이 탄생했다. 전혀 다른 분야의 지식을 연결하는 재조합적 이노베이션, 그것이 소셜이노베이터의 무기다. [소셜이노베이터 책]", "\"왜 천문학적인 예산이 투입된 공급자 위주의 사업은 지속가능하지 않을까?\" 문제의 주인이 해결의 주체가 되어야 한다. [소셜이노베이터 책]", "북스인터내셔널은 14개국에 걸쳐 동화책을 통한 국제개발협력의 이야기를 지금까지 계속하고 있다. 지속가능성은 공감하는 사람들의 연대에서 온다. [소셜이노베이터 책]", "유엔이 보다 많은 소셜이노베이터와 함께 한다면 어떤 변화가 시작될 수 있을까? 나는 여전히 그 가능성을 기대하고 기다린다. [소셜이노베이터 책]", "\"관련 예산이 없어 고생 많은 것 다 알고 있어. 내 개인돈이니까 걱정하지 말고 필요한 곳에 마음껏 써.\" 진심 어린 한마디가 사람을 움직인다. [소셜이노베이터 책]",
// ── 독서 인사이트 확장 (104개 책, 각 2개) ──────────────────
"ESG 관련 책들이 많이 나오는 가운데, 경영의 여러 관점(재무, 회계, 마케팅, 공급사슬, 글로벌전략, 리더십, 인사관리 등)에서 관련 쟁점과 흐름을 다룬 책으로는 드문 <ESG 시대의 사회적 가치와 지속가능경영>. [ESG 시대의 사회적 가치와 지속가능경영]", "이 책은 사회혁신 박사과정을 공부하면서, 몇개의 논문에 대한 큰 인사이트를 주었다. 불확실성이 극대화된 초기 단계 스타트업 대상의 '투자 의사결정 구조'에서 Human only, AI only, Human-AI teaming 등 어떤 구조가 더 효과적일까 고민을 하면서, 어떤 구조인지도 중요하지만 언제 어떤 맥락... [메타인지]", "백캐스팅은 현재의 상황이 되기까지 과거로부터 이어진 경로의존성(path dependency)을 벗어나기 위한 메타인지이기도 하다. 포장도로가 쭉 이어져 왔기에 현재까지 도달했지만, 그 포장도로가 앞으로 쭉 이어진 방향이 우리가 원하는 목적지가 아니라고 한다면, 새로운 경로를 발견해야 한다. [메타인지]", "이를 조직문화 관점에서 적용해보고 싶은 분들은 <매니지먼트 3.0>, 투자 관점에서 생각해보고 싶은 분들은 <확률적 사고의 힘>, 사회혁신의 관점에서 생각해보고 싶은 분들은 <사회 변화를 위한 시스템 사고>, 학습과 성장의 관점에서 생각해보고 싶은 분들은 <학습하는 조직> 등을 추천드립니다. [확률적 사고의 힘]", "파도가 칠 때 두려움에 압도 당하지 않고도 파도가 칠 때 서핑을 할 수 있는 방법은 무엇일까? 내 주변에 함께 하는 커뮤니티 또는 내가 존경하는 동료들이 반드시 있어야 한다. 그제야 가장 큰 두려움은 가장 큰 힘으로 변화할 수 있다. [파도가 칠 때는 서핑을]", "자주 접하거나 방금 접한 어떤 정보의 우연한 긍정적/부정적 영향에 휩싸이고, 노이즈나 문제가 있다는 것이 오히려 자연스럽고 정상인데 이런 사실들이 '큰 문제가 생겼다'고 오인한다. 따라서 문제를 즉각 해결해 준다는 제안과 비결에 우리는 모르게 속아 버린다. [노이즈]", "<노이즈: 생각의 잡음>은 노벨경제학상을 받은 대니얼 카너먼 등이 지은, 우리가 인식하지 못하지만 우리의 판단에 큰 영향을 주는 잡음(noise)과 편향(bias)에 대한 책이다. [노이즈]", "기후위기와 관련된 책 중에 기후위기의 내용을 '기승전-식량'으로 풀어내 특히나 좋았던 <식량위기 대한민국>. 업종/산업 종사하는 분야와 상관없이 꼭 추천드리고 싶은 책. [식량위기 대한민국]", "지인 추천을 받아 오늘 완독한 <탤런트 코드>. 그냥 연습이 아니라 심층연습이라 부르는 방식을 통해 우리 뇌 속, 신경 회로 주변에 증가하는 '미엘린'이라는 층을 두껍게 하고, 그 결과가 정교한 '스킬'이라는 보상으로 이루어진다고 한다. [탤런트 코드]", "뇌는 우리에게 2가지 모두 선택 기회를 제공한다. 하나는 편하고 익숙한 것(자동항법장치)을 택하고, 특별한 에너지를 쏟을 일 없이 살아가도록 하는 것(사는대로 생각하기), 다른 하나는 힘이 들고 익숙하지 않는 것(심층 연습)을 택하고, 특별하게 에너지를 쏟아 새로운 것을 습득하고 발전하도록 하는 것(생각하는 대로... [탤런트 코드]", "<최고의 조직>은 자주 참고하고 인사이트를 얻는 김성준 님의 최근 책이다. 읽기 쉽고 인사이트와 울림이 강하다. [최고의 조직]", "한 편의 추리소설 읽는 기분을 선사한 <좋은 불평등>. 이미 제목에서 이 모순어법의 의미를 알고 싶다는 간절함이 추리소설이 가진 트릭을 잘 제공한다. [좋은 불평등]", "'좋은+불평등'은 함께 쓰이는 조합이 원래 아니다. 저자는 그 조합을 더 큰 메타인지 조합(좋은 불평등, 나쁜 불평등, 좋은 평등, 나쁜 평등)에서 펼쳐놓고, 특정시점에서의 단층면이 아닌 굴곡과 굽이를 갖는 여정으로서의 경제를 바라본다. [좋은 불평등]", "적지 않은 분이 추천해 주셨던 <성취예측모형>을 두달 전 읽기 시작했다가 남은 1/5 분량을 오늘 마저 끝냈습니다. [성취예측모형]", "대신, 저자가 면밀하게 관찰하고 경험한 독일 사례를 바탕으로 분권화(decentralized), 자율화(autonomous), 네트워크화(networked organization) 등 독일의 정부설계 원칙을 토대로한 DANO 원칙과 핵심역량 기반의 성취예측모형을 소개합니다. [성취예측모형]", "이 부분은 <데이터는 어떻게 인생의 무기가 되는가>에서 말한 \"행복을 증진하는 가장 좋은 방법 중 하나는 에너지가 많이 들어갈 것 같은 활동을 피하려는 본능을 피하는 것이다\"와 일맥상통한다. [데이터는 어떻게 인생의 무기가 되는가]", "학부에서 한국사를 전공하면서도 왕과 정치 중심의 거대사가 불편해서 '미시사'(micro-history) 관련 책을 공부하며, 당대를 살아갔던 다양한 사람들의 서사가 어떠한지를 찾아봤는데 <알고 있다는 착각>은 이를 \"서사 경제\"(narrative economies) 또는 \"센스 메이킹\"(sense making)이... [알고 있다는 착각]", "'익숙한 것을 낯설게, 낯선 것을 익숙하게'라는 민족지학(인류학적 접근의 일종)이 어떻게 산업과 혁신 현장에서 효과적인지를 잘 보여주는 <알고 있다는 착각>. [알고 있다는 착각]", "'투자업계의 전설 '노마드 투자조합'의 시간을 자본으로 바꾸는 장기 퀄리티 투자 원칙과 지혜'라는 긴 부제가 달린 <노마드 투자자 서한>. 연말부터 오늘까지 아껴가며 읽었던 500페이지 독서가 일단락 되었다. 우선 MYSC 심사역과도 함께 다시 읽고 인사이트를 소화해볼 계획이다. [노마드 투자자 서한]", "'다양성은 어떻게 능력주의를 뛰어넘는가'라는 부제가 붙은 <다이버시티>... MYSC가 투자한 모든 스타트업 대표님들, 그리고 MYSC의 구성원들이 다 읽고 추천하고 싶은 책. [다이버시티]", "이런 분야에 관심있는 분들이라면 <평균의 종말>, <보이지 않는 여자들>, <스케일>, <생각의 지도>, <와이저>, <원칙> 등을 함께 읽어보시길 추천한다. 개인 서재에 꽂혀 있는 이 책들 역시 어머어마한 인사이트를 가져다주는데, <다이버시티>에도 이 책들이 종종 인용되면서 큰 울림을 준다. [다이버시티]", "<스토리텔링, 오리진과 변주들> 숨겨진 보물과 같은 책! 이런 책이 많이 읽히지/팔리지 않는다면 손해다. [스토리텔링 오리진과 변주들]", "1970년대에 이미 한국에 이러한 ESG 경영을 만들 사업기획을 할 수 있는 기업가(entrepreneur)가 존재했다니 너무 놀라웠다. 비콥(B Corp) 운동도 2006년에야 시작되었는데, 1970년에 전태일은 근로자의 인권과 성장을 지원하면서도 얼마든지 기업이 지속가능함을 상상했다. [전태일 평전]", "<전태일 평전>(조영래 저)... 소셜섹터에 있는 분들, 이 영역에 합류하고 싶은 분들 모두 꼭 읽어보면 좋을 책. 언젠가는 읽어야지 했던 책을 이번 출장을 기회로 해서 읽기 시작했고 주말에 놀람과 긴장, 그리고 (또 다른 의미의) 새로운 놀람까지 느끼며 읽었던 깊은 책. 개인적으로 <윤동주 평전>, <간디 자서... [전태일 평전]", "'비즈니스의 미래는 상업적 혁신(commercial innovation)이 아니라 사회혁신(social innovation)에 있다' [비즈니스의 미래]", "경제학자가 역사의 장면들을 바탕으로 총 13개의 게임이론을 설명하며, \"역사에서 만약 이랬더라면\"이란 조언을 제공한다. 워낙 역사를 좋아하는데, 여기에 게임이론까지 더했으니 개인적으론 술술 읽혔다. [게임이론으로 읽는 역사]", "전 세계 게임이론 전문가들이 참여한 '죄수의 딜레마 프로그래밍 게임'(모든 참여 전략들이 서로 겨루기 진행)에 참여한 14개의 전략, 그리고 그 이후에 다시 6개 국가 62개 프로그램이 참여해 다시 진행된 백만이 넘는 시뮬레이션 게임에서 연속 우승한 최고의 전략: 팃포탯(Tit for Tat) [게임이론으로 읽는 역사]", "내 의사결정과 생각이 누군가의 비합리적인, 집단착각에 따른 연쇄 반응에 휩싸이기 전, 스스로에게 반드시 주어야 할 기회: 독립적인 사고와 생각의 정돈 \"왜 그렇게 하고자(하지 않고자) 하는가?\" [집단착각]", "<집단착각: 인간 본능이 빚어낸 집단사고의 오류와 광기에 대하여>는 이러한 오류가 발생하는 현실을 분석하고, 이를 방지할 수 있는 방안을 이야기한다. [집단착각]", "히피에 가까웠던 그가 사업가가 되기까지 여정이 예전에도 궁금했었는데, 얼마전 파타고니아에서 출간한 <파타고니아 이야기> 중 '즐거운 인생'이란 이본 쉬나드의 글에서 많은 궁금증들이 해소됐습니다. [파타고니아 이야기]", "이 책을 읽는 동안, 내 인생의 책 중 하나인 스캇 펙의 <아직도 가야할 길>의 가장 첫번째 문장이 내내 떠올랐다. \"인생은 고해(고통의 바다)다.\" 스캇 펙은 '인생은 고통스럽다'는 것을 인정하지 않는 순간, 우리의 모든 고통은 시작된다라고 말하는데, 이는 <도파민네이션>에서 고통을 피하기 위해, 고통을 피하기... [도파민네이션]", "'에너지가 들어가야 하는 일'은 기본적으로 중독으로 이어지는 '쾌락'의 반대편 즉, '고통'에 가까운 일이다. 운동, 처음 만나는 사람들에게 다가가서 먼저 대화하기, 낯선 공간을 찾아가기, 지루한 시공간에서 견디기 등은 우리가 먼저 고통을 선택하고 이후에 찾아올 다양한 종류의 보상(보람, 행복감, 자긍심 등)으로... [도파민네이션]", "넷제로를 향해 진행되는 다양한 프론티어의 이야기를 담은 <넷제로 에너지 전쟁>. 지인이 공동저자라 더욱 와닿는 이야기들, [Eric Junghyuk Choi]( 잘 읽었습니다! - [넷제로 에너지 전쟁]", "책을 처음 읽을 땐 나는 핵개인의 시대에 부적응하는 부류인줄 알았는데, 이 두 가지 행동을 보니 나도 무지 가능성이 있네! [핵개인의 시대]", "회사 내에 '파트너' 역할을 새롭게 맡게 된 7명과 함께 읽고 토론하는 <임팩트 플레이어>. 전작 <멀티플라이어>를 통해 회사에서 누가 주목받고 기여하는지를 규명한 리즈 와이즈먼의 후속작. [임팩트 플레이어]", "조직에서 누구의 일도 아닌 기회는 무궁무진하다. 내 일 또는 내 역할이 아니라고 생각하는 다수 덕택에 그런 일과 기회는 무주공산이다. <임팩트 플레이어>는 그런 기회에서 시작해 '영향력(파급력)'을 키운 사례들을 조명한다. [임팩트 플레이어]", "<투자의 진화: 벤처투자가 만든 파괴와 혁신의 신세계>는 600페이지가 넘는 분량을 통해 벤처캐피털리스트는 누구이며, 벤처캐피털의 역사와 진화, 그리고 그 뒤에 흐르는 한 가지 명확한 법칙, 멱법칙(The Power Law)을 설명한다. [투자의 진화]", "나의 선한 의도와 노력이 입증되는 것에 초점을 맞출 때, 내게 주어진 권한과 영향력은 타인의 고통에 응답하는 사회혁신이 되지 않고, 나의 욕망에 충실한 전문성이 되어갈 위험이 있다. [타인의 고통에 응답하는 공부]", "책에는 저자가 자신의 한계와 위치를 명확히 하는 지점이 적지 않게 등장한다. '나는 사회운동가가 아니다'라고 말하는 저자의 태도가 얄밉거나 욕을 먹지 않는 것은, 자신의 한계와 위치를 가지고 '타인의 고통에 응답하는' 자신의 업(공부)를 지속해오기 때문이다. [타인의 고통에 응답하는 공부]", "\"목적에 있어서는 영리섹터가 소셜섹터와 훨씬 가까워졌지만, 방법론에 있어서는 소셜섹터가 비즈니스 세계와 가까워졌다\" - 퓨처메이커를 위한 조망과 상상 (SSIR CELEBRATES 20 YEARS) [퓨처메이커]", "스탠퍼드 소셜 이노베이션 리뷰(SSIR)의 창간 20주년 단행본인 <퓨처메이커를 위한 조망과 상상> [퓨처메이커]", "82세 현역 감독이자 지금도 매일 매일 야구장 가는 길이 제일 신난다는 '야구의 신' 김성근 감독의 <인생은 순간이다> [인생은 순간이다]", "출장 가는 길에 비행기에서 읽고 주말에 마저 읽은 <불변의 법칙>. 좋아하고 추천하는 <돈의 심리학>과 <운과 실력의 방정식>의 저자 모건 하우절의 최신간이다. [불변의 법칙]", "\"이펙추에이션은 특정한 목표로부터 시작하지 않는다. 대신 주어진 수단에서 시작하며 창업자, 그리고 상호작용하는 이해관계자들의 다양한 상상과 열망을 기반으로 목표가 발생한다\" [이펙추에이션]", "사람들이 설득되는 것은, 당신이 먼저 위험을 감수하는지를 볼 때 시작된다. 또한 '빅벳'이 가능해지기 위해서는 자신과 비슷하고 협력자들과만 함께 해서는 안된다. 이들과 함께 해야 할 영감과 목표를 탐색하는 이펙추에이션(effectuation)의 과정이 필요하다. [이펙추에이션]", "그런 면에서 박신양 작가에게 그림이 경계를 넘나드는 '제4의 벽'이라면, 나에게는 임팩트 비즈니스를 육성하고 키워가는 사회혁신(social innovation)이 경계를 넘나드는 '제4의 벽'일 수 있다는 점! [제4의 벽]", "제4의 벽: 연극에서 배우와 관객의 무간섭을 위해서 무대와 객석에 세워둔 보이지 않는 일종의 '가상의 벽'. 이 벽으로 인해 배우는 연기에 몰입하고, 관객도 배우의 연기에 몰입하는 기능을 하지만, 작가는 때로는 이 벽의 경계를 옮기고 확장하고 재구성해야 할 '상상과 현실이 호환되는' 제4의 벽' 재정의를 하고 있... [제4의 벽]", "<0.6의 공포, 사라지는 한국: 아이가 있는 미래는 무엇으로 가능한가> 지난주 해외 출장을 가면서 읽을 책을 골랐다가 너무 빠져들어서 인천공항 가는 지하철과 비행기 안에서 거의 다 읽을 수 있었다. [0.6의 공포]", "이 책을 읽으며 나는 생각보다 '벤처마인드셋'이 평균 이상이라는 것을 느꼈다. 과거에 나는 투자에 어울리는 역량이나 성격이 전혀 없다고 생각한 적이 있는데, 불확실성에 대한 태도나 장기적인 인내, 그리고 다른 사고와 인간에 대한 깊은 관심 등은 내가 하는 임팩트투자에 대해서 좋은 자산이 됨을 새삼 느낀다. [벤처마인드셋]", "세계적인 협력 분야의 고전 <협력의 진화>는 무엇이 성공을 위한 최고의 전략일 수 있는지를 이 흥미진진한 겨루기를 설명하며 호혜주의에 입각한 이타주의가 결국 성공의 길임을 증명해낸다. [협력의 진화]", "내 성공과 내 조직의 승리를 위해 아무리 복잡한/정교한 전략을 짜서 나를 중심으로 최선의 결정들만을 모아서 추구한들, 왜 궁극적인 게임에서 이길 수 없는지 <협력의 진화>는 생생한 사례를 소개한다. [협력의 진화]", "1. 내게 행복이란, '아직도 가야할 길' 저자 M. 스캇 펙이 정의하는 \"인생은 고해다\", 그리고 '행복의 기원' 저자가 정의하듯 \"삶은 갈등의 연속/경쟁의 연속\"임을 떠오를 때 잠시잠깐 자주 주어지는 긍정적 경험들로 해석된다. [행복의 기원]", "한 매거진의 '미지의 영역' 주제 테마에서 인터뷰를 했고, '내 인생의 책'까지 추천을 요청하셔서 위와 같이 보냈습니다. 2025년을 마무리하고, 2026년을 준비하면서 책 한 권 읽어볼까 생각하신다면, <행복의 기원> 추천드립니다. 술술 읽히고, 나름대로의 반전과 충격도 가득합니다. '행복이 정말 이런거라고?' [행복의 기원]", "\"누가 옳은가가 아니라 무엇이 옳은가를 찾으려는 것이다\"라는 숙론의 목적에 대해 다수의 한국인은 제대로 교육도 실습도 해보지 못했다. 자신의 이야기를 어떻게 나눌지, 나와 다른 상대방의 견해를 어떻게 수용할지, 그리고 집단적인 토론을 통해 어떻게 의사결정을 해야 할지 확신이 들지 않을 때, 최재천 교수님은 이 책... [숙론]", "각양각색 위원장 맡는 것이 주전공(?)이라 '위원장 동지'로 통한다는 최재천 교수님과 나 역시 한 위원회에서 함께 하고 있다. 역시 이곳에서 교수님은 민간측 공동위원장을 맡고 있고 나는 위원이자 책에서 '숙론'의 방식으로 설명되는 '기획소위원회' 소속도 하고 있다. [숙론]", "중3 아이를 키우고 있어 너무 공감이 된 <불안세대>(The Anxious Generation). 어제 제주도에 갔다가 공유공간에서 어떤 아이(3살 정도로 보이는)가 혼자서 스마트폰을 가지고 인스타그램의 릴스를 보고 스크롤업해가는 것을 보고 깜짝 놀랐다. [불안세대]", "인류학이 아직 생소하거나 관심이 덜하다면, 이 책 전에 추천하는 책은 <인간은 의례를 갈망한다>라는 책. '의례적' '의례히'라고 흔히 말하는 그 '의례'가 진짜 어떤 의미인지, 왜 특정 지역의 사람들이 연중 특정한 시기에 뜨겁게 달궈진 석탄 위를 맨발로 걸어가는지, 그게 현대 사회에도 어떤 의미가 있는지 무척 ... [인간은 의례를 갈망한다]", "이번 추석에 꼭 읽어보길 추천하는 책 <인간은 의례를 갈망한다: 삶을 의미 있게 만드는 리추얼의 모든 것>. 실험인류학이란 인류학, 심리학, 인지생리학 등이 복합 관점이 인류가 오랫동안 발전시켜온 풍부한 '의례'의 의미를 추적하고 설명해 간다. [인간은 의례를 갈망한다]", "2024년 현재까지 읽은 많은 책 중 가장 흥미롭고 빠져들었던 책 <물고기는 존재하지 않는다> [물고기는 존재하지 않는다]", "<협력의 역설>은 \"상대방이 내 뜻대로 되지 않으니 내가 앞으로 나아가는 방법을 찾아야\" 한다고 말하며 그래서 더 나아가 \"적은 가장 좋은 스승이 되어줄 수 있다\"고 말한다. 그래서 협력은 역설적이다. [협력의 역설]", "<박태웅의 AI강의 2025> \"사람을 위한 인공지능\"이라는 관점이 곳곳에 녹아있는 멋진 책. [박태웅의 AI강의 2025]", "<불확실한 걸 못 견디는 사람들: 가장 큰 두려움을 가장 큰 힘으로 바꾸는 법> 아리 크루글란스키 [불확실한 걸 못 견디는 사람들]", "파타고니아의 창업자 이본 쉬나드와 철학 담당 이사 빈센트 스탠리가 쓴 <파타고니아 인사이드: 파타고니아가 그리는 책임경영 기업의 미래>는 '옳은 일'이란 무엇인가를 지난 50년간 우연하게 또는 의도적으로, 그리고 겸손하면서도 소송을 불사하며 집요하게 찾아가는 여정이 담겨져 있다. [파타고니아 인사이드]", "사회경제문화적으로 또 다른 불확실성이 가득한 2025년을 앞두고, MYSC는 어떤 '의미있는 여정'을 설계해야 할지 고민하게 되는 이 떄에 <파타고니아 인사이드>는 역시 풍성한 영감으로 가득차다. [파타고니아 인사이드]", "23년 본격 시작되어, 25년부터는 민간플랫폼도 참여가 허용되어 보다 기부자 친화적인 서비스 경쟁이 시작되는 고향사랑기부제(고향세)에 대한 <로컬의 탄생> [로컬의 탄생]", "여의도 인근 카페에 전국 각지, 무명씨들로부터 선불 결제가 가득찼다. 누구든 들려 따뜻한 커피 한잔 하시라는 관대함은 '가장 다정한 전염'이다. [가장 다정한 전염]", "관대함은 혐오와 분열에 맞서 세상을 바꾼다. 가장 다정한 전염은 탄핵을 지지한다. 내가 표를 행사할 국회의원이었다면 탄핵에 찬성할 것이다. [가장 다정한 전염]", "한국인의 기원에 대한 관심에서 시작했던 독서가 내게는 하나의 big insight & idea를 얻게 하는 소중한 경험이었다. []( [한국인의 기원]", "\"18세기의 스티브 잡스\"라고 불리는 조사이어 웨지우드의 삶과 혁신에 대한 책 <조사이어 웨지우드: 거인의 일과 생애> [조사이어 웨지우드]", "이 책은 \"아무리 발달된 과학기술과 인공지능이라 해도 인류의 문제를 해결하려는 의지는 갖지 못한다\"고 선언하며, 전략적이며 창의적인 의도적인 네트워크 즉 '임팩트 네트워크'를 만들어야 한다고 설명한다. [임팩트 네트워크]", "임팩트 네트워크는 \"공동의 목적을 위해 학습과 행동을 추진해 나갈 수 있도록 개인과 조직을 함께 연결하는 특별한 종류의 네트워크\"이다. 이는 참여자 간의 신뢰 기반 관계를 통해 만들어지기에 상호의존적이며, 개별 조직 하나의 규모를 키우는 것(스케일업)보다 협력을 통해서 임팩트를 생성할 더 강한 연결을 키우는 규모... [임팩트 네트워크]", "<대통령의 글쓰기> 저자는 리더를 이렇게 정의한다: \"생각도 있으면서, 그것을 글로 옮길 수 있고, 그 글을 실천할 수 있는 사람\" [대통령의 글쓰기]", "<당신이 모르는 진짜 농업경제 이야기>는 이런 카카오를 비롯 쌀, 돼지, 딸기, 소, 그린바이오 등 다양한 먹거리, 그리고 역사와 세계를 종횡무진 하며 어럼풋이 안다고 생각했던 농업경제를 설명한다. [당신이 모르는 진짜 농업경제 이야기]", "첫 만남 때 서명과 함께 주셨던 책 <지구를 위한 변론>은 '지구법학'이라는 생소한 법학을 개척해가는 장관님의 이야기다. [지구를 위한 변론]", "책 제목처럼 '단 한 번의 삶', 작가가 되기 위해 글을 쓰지 않고, 글을 쓰다보니 작가가 될 수 있는 것처럼 말이다. 나 역시 내가 해야 할 일을 할 뿐이다. 그리고 그것이 내가 누리는 축복이고, 많은 사람들에게 주어진 것이 아닐 수 있기에 더욱 감사함을 많이 느끼게 된다. [단 한 번의 삶]", "<카오스, 카오스 에브리웨어: 기후변화, 금융위기, 인간을 이해하는 불확실성의 과학>은 우리 삶의 기본 시스템이지만, 우리는 정작 이를 피하려하거나 인정하지 않으려 하는 '불확실성'을 정면으로 다룬다. [카오스 카오스 에브리웨어]", "무척이나 매력적인 제목이 끌렸던 <왜 좋은 일자리는 늘 부족한가>는 이상헌 국제노동기구(ILO) 고용정책국장이 다양한 경제학자의 견해와 유럽의 역사적 사례를 통해 '좋은 일자리'에 대한 문제의식을 전하는 책이다. [왜 좋은 일자리는 늘 부족한가]", "세계적 석학인 '토마 피게티'와 '마이클 샌델'의 주고 받는 대화가 인상적인 <기울어진 평등: 부와 권력은 왜 불평등을 허락하는가>. 6월 3일 조기대선을 앞두고 있어 특히 많은 부분이 더욱 와 닿았다. [기울어진 평등]", "사회양극화, 경제불평등, 기후와 자연위기 등 세계 3대 난제 해결에 기여하는 것을 비전으로 가진 MYSC에게 우리가 현재 경험하는 구조적 '기울어진 평등'은 어떻게 해석되어야 할까? 그리고 여기에 우리는 어떻게 기여할 수 있을까? [기울어진 평등]", "\"세상이 내 뜻대로 안되는 이유, 그리고 그것이 오히려 다행인 이유\" \"적절한 좌절이란 세상이 내 뜻대로만 돌아가지 않는다는 것을 배우는 과정입니다\" [적절한 좌절]", "여기서 적절한 좌절은 \"수용 가능한 범위 안에서의 실패 경험\"을 의미한다. 저자들이 보기에, 그 어느 때보다 불확실성과 복잡계가 난무하는 현 시대에 아이들이든, 어른이든 '실패 경험'이 부족하다. [적절한 좌절]", "이 책은 흥미롭게도 직전에 읽은 <청킹맨션의 보스는 알고 있다>란 책과 같이 읽으면 찰떡궁합이다. 이 책 역시 호혜와 증여에 대한 깊은 인사이트를 제공한다 [청킹맨션의 보스]", "'기존의 호혜, 증여, 분배 이론을 뒤흔드는 불확실성의 인류학'이란 거창한 부제가 눈길을 사로잡았고 제목 또한 <청킹맨션의 보스는 알고 있다>는 오묘한 제목이라 읽기 시작한 책. 너무 재밌었다! [청킹맨션의 보스]", "<우리는 왜 선물을 줄 때 기쁨을 느끼는가>는 모든 것이 교환 가치를 가지며 거래될 수 있다고 생각하는 자본주의의 수 많은 빈틈이 놀랍게 채워지던 방식을 차근차근 설명한다. 부제가 그래서 부담스럽기도 한 '자본주의의 빈틈을 메우는 증여의 철학'. [우리는 왜 선물을 줄 때 기쁨을 느끼는가]", "손으로 쓴 글씨, 공적 장소에서의 우연한 대화, 길 찾기, 직접 접촉하는 자연 등의 기회가 디지털로 대체되면서, 우리는 '인간 경험'이 아닌 '사용자 경험'에 몰입하게 된다. 이 부분이 책에서 말하는 '경험의 멸종'의 핵심이다. [경험의 멸종]", "[]( 'AI 시대의 실용적 생존 가이드'라는 부제로 번역된 이 책의 원제는 Co-Intelligence: Living and Working with AI다. [듀얼브레인]", "<리스크 테이커: 불확실성의 세계에서 지속적 우위를 찾는 법>(On the Edge)이란 책은 무작위와 같은 risk-taking을 통해 엣지(edge)라고 불리는 '장기적 우위'를 구축하는 세계를 조명한다. [리스크 테이커]", "그 비전은 ‘블루 뉴딜(Blue New Deal)’로 구체화되며, 흥미롭게도 MYSC와 같은 임팩트투자사에게도 투자 대상으로 제안된다. [블루 뉴딜]", "그 콜링의 여정에 나 역시 소중하게 아주 작은 조연으로 참여하고 있다. 신기한 것은 당시 잘 아는 관계가 없던 내가 건 '전화'(calling)에 대표님이 응답했다는 점이다. [콜링]", "에이아이웍스(AIWorkx) 윤석원 대표님이 쓴 콜링(Calling), 강렬한 제목과 같이 내용 역시 창업자가 '콜링' 없이는 감당하기 어려운 여정에 대한 매우 솔직한 내용들이 나온다. (테스트웍스로 시작되어 이제 AIWorkx로 이름이 바뀌었고, 얼마전 국가AI 컨소시엄으로도 당당히 선발되었다!) [콜링]", "<미래를 모금하라>는 보수적이고 전통적으로 알려진 모금기관 생태계가 '웹3.0시대, 블록체인, 암호화폐, NFT를 활용한 혁신적 모금 방법'에 대한 학습 여정과 틀 깨기를 시도하는 흥미로운 책이다. [미래를 모금하라]", "정말 오랜만에 나온 그의 책 <낯섦과 공존: AI 시대의 세계관 확장 수업>은 AI를 '기술의 변화'가 아닌 '문화의 변화'로 보도록 도우며, 그의 특유의 인문학적 관점과 개인의 경험이 녹여든 따뜻한 책이다. [낯섦과 공존]", "'그게 과학이냐?' '그게 학문이긴 하냐?' '무엇으로 먹고 살건데?'와 같은 주변의 이야기와 자신보다 앞선 길을 걷는 선배들을 찾기 어려웠지만, '보존생물학'이란 길을 개척하고 있는 저자의 <호랑이는 숲에 살지 않는다>란 신간. [호랑이는 숲에 살지 않는다]", "지난 1달여 일본을 두번 방문(센다이, 도쿄)하는 사이에 읽은 두 권의 책: <지극히 사적인 질문>과 <한국인의 눈으로 본 근대 일본의 역사> [지극히 사적인 질문]", "외국에서 일본 문화를 이해하는 가장 고전적이라 불리는 이 책을 이제야 읽었다. 최근 3개월 간 매월 일본을 방문했다. 센다이, 도쿄, 후쿠오카 등을 오가면서 준비한 일본 관련 3권의 책을 읽었는데, <지극히 사적인 일본>, <한국인의 눈으로 본 근대 일본의 역사>에 이어 마지막 책이었다. [한국인의 눈으로 본 근대 일본의 역사]", "예전에 유엔에 근무하며 다양한 국가에 출장을 갈 때 문화에 대한 이해가 너무 부족해 가급적 그 나라의 역사와 문화를 이해하는 책들을 동시에 읽었던 적이 있다. 일본 역시 내가 너무 잘 몰랐구나 깨닫는 바가 있어 우선 책을 읽었는데, 특히 <국화와 칼>은 너무나 너무나 흥미로웠다. 추리소설을 읽듯 빠져드는 느낌. [국화와 칼]", "<국화와 칼>을 읽으니, 한국에서는 '안될 것 같은데?'라고 생각했던 비즈니스들이 신기하게 일본에서는 성행하는 이유가 이해되기 시작했다. 그런 면에서 일본 시장과 스타트업에 투자하고자 한다면, 이 책은 문화인류학적으로 꼭 읽어볼 인사이트가 가득하다. [국화와 칼]", "\"어떤 공동체나 이 세계에서 긴급한 하나의 문제를 근본적으로 해결하기 위해 집중된 노력\"으로 정의되는 '빅벳'은 점진적인 개선, 단순한 개선을 넘어, 그 동안 안되는 이유가 명확했던 문제들에 대해 현실의 벽과 관행, 규제 탓에 머물지 않고 문제 해결에 집중하는 전략이다. [빅벳]", "록펠러재단 회장이 쓴 '빅벳'은 우리 시대 거대한, 복잡한 문제를 어떻게 해결할 수 있을지에 대한 자신의 경험과 조언들로 가득하다. 올해 초록우산 어린이재단의 전략자문위원으로 함께 하게 되면서 황영기 회장님이 선물해주신 책이기도 하다. [빅벳]", "제미나이에게 다음과 같이 부탁했다: \"너는 소설비평가야. 가와바타 야스나리의 '설국'에 대한 해설을 내게 해줘. 소설의 구체적인 장면, 대화 등을 인용하며 설명해주는 것도 부탁해. 그리고 이를 소셜임팩트, 사회혁신과 연계해서 나는 어떤 인사이트를 가질 수 있을지 조언해줘\" [설국]", "한 달에 하나씩 문학 작품을 읽고, 해당 문학 작품이 내 '멘토'가 되도록 ai에게 요청해서 상호작용을 하고 있다. 문학 작품이 훨씬 가깝게 내 삶에 다가온다. 지난번 <이방인>, <설국>을 시작으로 이들이 내 멘토가 되었고, 이번에 <이반 일리치의 죽음>도 내 멘토가 되었다. [설국]", "\"지금 내 머릿속에 가장 강렬하게 남아 있는 10가지 장면을 꼽아보면, 대부분 잘못된 의사결정이다\" - 이 대목에서 나도 노란색 포스트잇을 꺼내고 나의 장면들을 써내려갔다. 내겐 감사한 장면들이 주로 많았지만, 잘못된 의사결정이라고 볼 수 밖에 없는 것들도 분명했다. [실패를 통과하는 일]", "<실패를 통과하는 일> 박소령 대표님의 '어느 창업자의 기록' . 부제에 나온 '비전, 사람, 돈'은 모든 스타트업 대표가 매달 매일 흔들리고, 생각이 바뀌고, 고민하고, 기쁘다가 두려움을 갖게 되는 어떤 대상 또는 어떤 영역을 잘 집어 내었다. [실패를 통과하는 일]", "\"절대 두며 안되는 수\"라 표현한 이 수. 전문가가 스스로 이건 '하수'이고, 이건 내 프로 이력에서 둘 수 없다고 말한 그 경계를 넘어간 순간, 이세돌은 역설적으로 '바둑'에서 사람의 진짜 역할을 찾았다. [이세돌 인생의 수읽기]", "<이세돌, 인생의 수읽기>는 '반상 위의 전략으로 삶의 불확실성을 돌파하다'라는 부제가 말해주듯, 전 세계에 알려진 '인간과 AI 알파고'와의 대국을 기점으로 그가 경험한 처절한 변화와 교훈에 대한 이야기다. [이세돌 인생의 수읽기]", "이 책의 논점은 바로 직전에 읽은 <필연적 혼자의 시대>(김수영 저), 그리고 작년에 읽었던 <존 칼훈의 랫 시티>와도 깊게 연결되었고, 곧 읽기를 시작하는 <쾌적한 사회의 불쾌함>과도 관련되어 일종의 '꼬리에 꼬리를 무는 독서'로서 연속적 읽기 경험이었다. [존 칼훈의 렛 시티]", "인구소멸에 대한 실험 보고서란 부제가 있는 <존 칼훈의 렛 시티(Rat City)>는, 실험 쥐를 통해 가상으로 진행해 본 유토피아(먹이가 충분하고, 충분히 넓은 공간, 온도, 습도, 및 외부로부터의 포식자 공격이 제거된 완벽한 세계)가 어떻게 변할 수 있는지를 보여주는 다큐멘터리다. [존 칼훈의 렛 시티]", "\"급진 거북이는 목적에 대해서 과감하고 급진적으로 헌신하는 태도를 보이지만, 실현하는 방식에서는 꾸준하고 차분하고 조용히 움직인다\" [급진 거북이]", "<급진 거북이>는 빠른 것과 느린 것이 함께 표현되는 역설적 제목인데, 여기에는 어떻게 목적과 현실이 같이 공생-공진할 수 있는지에 '우주'의 비밀이 포함되어 있다. [급진 거북이]", "<인구와 부: 축소의 시대가 아닌 확장의 시대>에서 말하는 부는 \"서로를 지탱하는 관계의 자본, 신뢰와 연대 같은 사회적 자본, 그리고 다음 세대를 위한 기회와 가능성까지 모두 포함하는 넓은 의미로 확장\"되어 소개된다. [인구와 부]", "'인구와 부'가 말하는 \"서로를 지탱하는 관계의 자본\", \"신뢰와 연대 같은 사회적 자본\", 그리고 \"다음 세대를 위한 기회와 가능성\"은 어떻게 만들 것인가? [인구와 부]", "\"지금의 그, 즉 오늘날의 이반 일리치를 만들어 준 것들이 떠오르자마자 당시에 기쁨으로 여겨지던 모든 것이 이젠 거의 눈앞에서 싹 녹아 버리며 뭔가 하찮은 것으로 바뀌었다.\" [이반 일리치의 죽음]", "남들 부럽지 않게, 남들에게 뒤쳐지지 않게, 남들과 비교해도 손색 없고, 남들과 어깨를 나란히 할 정도의 '가장 단순하고 평범한' 45년의 삶을 살아온 주인공 이반 일리치가 어떤 사건을 통해 '과연 나는 제대로 된 삶을 살았는가?'를 찾아가는 톨스토이의 '작은 걸작' <이반 일리치의 죽음> [이반 일리치의 죽음]", "\"2014년 성동구청장으로 일하기 시작하면서 성수동에서 수많은 사람들을 만났다... 정경선, 허재형, 김정태 대표와 같은 청년 사회혁신가들과는 소셜벤처와 기업가 정신에 대해 함께 고민했다.\" [성수동]", "이제는 다른 수식어가 필요 없는 '성수동'. 이 지역에 대한 가장 권위있는 정본이 나타났으니 바로 정원오 성동구청장님이 직접 쓰신 <성수동>이란 책이다. 이 책에 MYSC와 내 이름은 일곱 차례, 분량으로는 거의 3페이지 분량이 나온다. 큰 영광이다. [성수동]", "<먼저 온 미래>, 작년 일찌감치 책을 읽었으나 2026년을 시작하며 다시 복기하며 내가 속한 임팩트 생태계에 '먼저 온 미래'는 무엇일까 생각해봤다. [먼저 온 미래]", "그렇다면 무엇이 변수일까? 책에도 많은 힌트들이 나온다. 바로 '왜'라는 질문과 호기심을 가지고 세상을 끌어안고, 세상을 해석해가는 사람들, 그리고 자신의 색깔과 세계관의 서사를 풍요롭게 해가는 사람들이 '먼저 온 미래'를 지배할 유력종의 후보들에 속한다. [먼저 온 미래]", "'인구'라는 주제를 인구소멸의 섬뜩한 호러 무비에서 인간에 대한 소중함을 느끼는 휴먼서사 무비로 보도록 돕는 <인구에서 인간으로>. [인구에서 인간으로]", "<직원들이 회사를 샀다>는 공기업에서 민영화되어 대기업 계열사가 되었다가, 매각이 되는 과정에서 임직원들이 1인당 5천만원씩 출자를 하고 추가로 홀딩스(협동조합)를 만들어 상장사(코스피) 최초의 종업원지주제 기업이 된 '한국종합기술' 이야기다. [직원들이 회사를 샀다]",
// ── CEO 급여명세서 추가 57개 ────────────────────────────────
"2018년은 MYSC에게 1차 리즈 시절이었다. 단체복을 입고 첫 촬영을 하고, 처음으로 비행기를 타고 제주도 워크숍을 다녀왔다. 작은 시작이 지금이 되었다. [CEO 급여명세서]", "아주 많지도 않게, 낭비되지 않을 만큼 천천히 한 방울의 물이 모아져 떨어지게 하는 데에 처음엔 많은 시도와 시행착오가 필요했다. [CEO 급여명세서]", "꾸준히 흘려보낼 작은 물방울, 그리고 매번 그 물방울을 흘려 보내는 작은 수고면 된다. [CEO 급여명세서]", "여러분 덕에 MYSC도, MYSC가 함께 하는 고객도 정체되지 않고 계속 흘러간 한 달이었다. [CEO 급여명세서]", "봄이 찾아왔다. 겨울에서 봄으로의 전환을 계기로, 우리에게도 새로운 생각의 전환을 즐겁게 상상한다. [CEO 급여명세서]", "누군가는 다르게 생각하고 있다. '이건 예전 경험이 없으니 오히려 제약 없이 더 잘 될 것 같아!' '주어진 자원이 부족하니 더 창의적이며 lean하게 해볼까?' [CEO 급여명세서]", "개인의 성장이 불필요하다고 생각하는 사람을 강제할 수는 없지만, 개인의 성장욕구가 분명한 사람은 조직이 돕고 존귀케 할 수 있다고 믿는다. [CEO 급여명세서]", "조직의 성장과 개인의 성장은 양자택일의 이슈가 아니라 원래 통합된 하나의 미션이다. MYSC는 어떻게 이를 입증할 수 있을까? [CEO 급여명세서]", "리더로서 시행착오와 회고는 부끄러운 것이 아니다. 더 신뢰를 주는 조직이 되기 위한 과정이다. [CEO 급여명세서]", "여러분 한명 한명이 MYSC 브랜드이며, MYSC 브랜드는 여러분 각자의 신뢰와 신용이다. [CEO 급여명세서]", "외부에서 MYSC 브랜드를 더욱 선명하게 인식하기 시작한 것은, 말하는 것과 행하는 것이 가급적 일치되도록 각고의 노력이 뒷받침되었기 때문이다. [CEO 급여명세서]", "무엇이 무엇임과 동시에 무엇이 아닌 것까지 판별이 되기 시작할 때, 우리는 그것을 브랜드라고 말한다. [CEO 급여명세서]", "우리가 정성스럽게 만드는 페이버(favor)는 우리가 알게 모르게 이 우주에서 스스로 꽃을 피고 멋진 변화의 촉매제가 된다. [CEO 급여명세서]", "타석에 서서 6번을 삼진아웃 당하고 4번을 공을 맞추면 빼어난 타자가 되는 것처럼, 지금 충분한 삼진아웃을 경험하는 것 역시 의미있고 필요한 성장의 축적이다. [CEO 급여명세서]", "불투명하고 실패할 수 있어도 나아가는 엑스트라마일(extra-mile)의 현장에서 우리는 계속 수고하고 있다. [CEO 급여명세서]", "\"왜 이리 모호하지?\" \"내가 해본 적이 없는데 이걸 어떻게 해?\" 이런 질문들은 자연스럽다. 우리가 속한 업, innovation이 어떠한 것인지를 되묻는 신호다. [CEO 급여명세서]", "자기와 타인을 확대하고 성장하도록 돕는 과정을 사랑이라고 한다면, 일생 동안 가장 큰 위험은 바로 성장에 따른 위험이다. [CEO 급여명세서]", "가야 할 길의 전부를 미리 보길 원하며 그 한 걸음 한 걸음이 안전하다는 것을 미리 보장받기를 원하는 건 불가능하다. 그것은 성장의 길이 아니다. [CEO 급여명세서]", "성장하려는 의지를 가진 어른이 되어라. 즐거움을 나중으로 자제하고, 책임을 자신이 지며, 진실에 헌신하고, 균형을 맞추는 것. [CEO 급여명세서]", "감사함을 표하는 그분의 눈에서 촉촉한 물기가 느껴졌다. 작은 친절 하나가 누군가의 인생을 바꾸는 용기가 될 수 있다. [CEO 급여명세서]", "\"최근 좋은 투자자의 제안도 거절했는데, 저희는 MYSC 투자를 받고 싶습니다. 기다릴 테니 때가 되면 알려주세요.\" 신뢰는 이렇게 쌓인다. [CEO 급여명세서]", "\"실패할 확률이 높아도 도전하고 길을 개척하는 게 딱 MYSC스럽네요!\" 우리의 정체성은 도전 앞에서 드러난다. [CEO 급여명세서]", "현실이 규정하는 가능성의 범위에 머물지 말고, 적극적으로 가능한 범위를 찾아나서는 것이 소셜이노베이터의 전형적인 모습이다. [CEO 급여명세서]", "역사를 전공했음에도 제대로 들어보지 못했던 역사를 듣고 경험하는 순간, 내가 아는 것과 인식하는 세계가 무척 제한된 세계라는 것을 깨닫는다. [CEO 급여명세서]", "'기회의 문'에 다가서고 싶은가? 소셜이노베이터가 거인과 만나 그 어깨에 올라서는 간단하면서도 강력한 전략: 바로 연결되어 있는 또 다른 거인을 찾아나서는 것. [CEO 급여명세서]", "지금 가진 시간과 지식, 자원을 충분히 나누고 있지 않는다면 훗날 나눈다는 것은 불가능에 가깝다. 나눔은 미래가 아닌 지금 시작된다. [CEO 급여명세서]", "북스인터내셔널은 지금까지 14개국에 걸쳐 동화책을 통한 국제개발협력의 이야기를 계속하고 있다. 지속가능성은 공감하는 사람들의 연대에서 온다. [CEO 급여명세서]", "준비된 사람만이 우연한 기회를 잡을 수 있다. 나는 그날을 위해 미리 A4 한 장에 프로젝트 이름을 써두었다. [CEO 급여명세서]", "\"교수님, 제가 특별히 제안할 것이 있습니다.\" A4 한 장에 쓴 꿈이 만남을 만들었다. [CEO 급여명세서]", "우리가 마주하는 사회문제 해결에서, 문제 해결에 집중하기 전 이 문제를 풀고자 하는 우리는 누구이며 어떻게 상호작용해야 하는가를 먼저 돌아봐야 한다. [CEO 급여명세서]", "사이먼 사이넥은 말한다. 무한게임의 결말이란 게임을 지속할 의지력을 잃거나 자원을 다 쓴 참여자가 게임에서 물러날 뿐이다. [CEO 급여명세서]", "반대로, 내가 잘 모르는 것을 기반으로 협력하면 상대와의 조율과 협의가 필수가 된다. 이때 협력은 비로소 살아 움직인다. [CEO 급여명세서]", "협력의 어려움은 정답이 하나라는 가정에서 출발한다. 정답을 확신할수록 타인의 답은 불필요하게 느껴지고, 함께 일하기는 더 어려워진다. [CEO 급여명세서]", "AI의 치밀한 계산을 넘어서게 만드는 것은 우리의 믿음이다. 확률의 게임을 넘어서는 힘은 예측 불가능한 인간의 헌신에 있다. [CEO 급여명세서]", "모어댄 같은 소셜벤처는 존재하지 않았던 시장의 기회를 새롭게 만들고, 가치라고 생각하지 않았던 새로운 제품과 서비스를 만드는 혁신 벤처다. [CEO 급여명세서]", "\"다시 태어나도 해녀를 할 거예요.\" 50년 경력의 해녀 고봉순 씨의 한마디. 소명을 찾은 사람의 얼굴은 다르다. [CEO 급여명세서]", "가장 지역적인 경험과 이야기가 가장 세계적인 경험과 이야기가 될 수 있다. 제주 해녀의 삶이 뉴욕 브로드웨이를 꿈꿀 수 있는 이유다. [CEO 급여명세서]", "탄소가 미래 화폐가 될까? 대기업 모두가 탄소 배출을 낮추는 제품 개발에 몰입하는 지금의 현실을 보면 이미 그 시대는 왔다. [CEO 급여명세서]", "임팩트 시대는 어떠한 모습이 될까? 선행지표로 활동하는 혁신적인 스타트업들을 통해 코로나19 이후 시대를 상상해본다. [CEO 급여명세서]", "베스트셀러를 보고 다른 사람의 선택을 따라가는 관행은 생각보다 많다. 진정한 독서는 남이 읽는 책이 아닌 내가 필요한 책에서 시작된다. [CEO 급여명세서]", "소비자로서 내가 내리는 일상의 선택이 곧 임팩트투자다. 소비자로서 가격을 지불할 때, 그 돈 자체가 임팩트투자가 된다. [CEO 급여명세서]", "해외 순방에서 대통령이 공식 참석한 행사가 사회적기업가정신이란 주제로 진행된 것은 단군 이래 처음이었을 것이다. 임팩트 시대가 왔다. [CEO 급여명세서]", "올리버 색스는 환자를 정상과 비정상으로 섣부르게 나누는 학계에 반기를 들었다. 틀을 깨는 관찰이 세상을 바꾼다. [CEO 급여명세서]", "불투명하고 실패할 수 있어도 나아가는 현장에서 여러분들이 무수히 흘려 보낸 땀방울과 작은 노력이 모여 MYSC가 된다. [CEO 급여명세서]", "네가지 유형의 기업가: 기업가, 사내기업가, 사회적기업가, 사회적 사내기업가. 당신은 어떤 유형이 되고 싶은가? [CEO 급여명세서]", "어떤 공동체나 이 세계에서 긴급한 하나의 문제를 근본적으로 해결하기 위해 집중된 노력, 그것이 빅벳이다. 점진적 개선을 넘어 현실의 벽을 돌파하는 전략. [CEO 급여명세서]", "성장에 따른 위험은 자신을 확대하는 것, 즉 새롭고 익숙하지 않은 영역으로 들어가는 것이기에 우리는 본능적으로 이를 피하려 한다. [CEO 급여명세서]", "\"한결아, 지금 힘들게 배우는 평영이 나중에 바다에서 멋지게 수영하는 나를 만들어줄 거야.\" 지금의 수고가 미래의 자유를 만든다. [CEO 급여명세서]", "하지만 이제는 춥고 긴 겨울밤을 버텨내는 데에 많은 것이 필요하지 않음을 안다. 꾸준히 흘려보낼 작은 물방울, 그리고 그 물방울을 흘려 보내는 작은 수고면 된다. [CEO 급여명세서]", "\"아빠, 나랑 놀자.\" 그 말 한마디가 때로는 가장 중요한 우선순위를 일깨워준다. [CEO 급여명세서]", "공동체적 지원, 비단 탈북민 창업자에게만 해당되는 이야기가 아니다. 임팩트 비즈니스의 창업가에게도 우리가 그동안 놓쳤던 것이 있지 않을까? [CEO 급여명세서]", "의도성, 추가성, 측정성이라는 원칙은 더 좋은 기업, 더 탁월한 기업을 발굴하는 임팩트투자의 비결이다. [CEO 급여명세서]", "스스로에게 허락하라. 지금 이 길이 낯설고 두렵더라도, 자기허락이 없이는 시작조차 할 수 없는 길이 있다. [CEO 급여명세서]", "1년간 4개의 조직을 불가피하게 옮겨 다니며 성장의 기회를 만나지 못했다는 분의 눈물. MYSC는 그 눈물에 어떻게 응답할 수 있을까? [CEO 급여명세서]", "사내기업가에게 에너지 관리 전략이 부족하면 성장의 기회가 번아웃이 된다. 더 각별한 시스템씽킹이 리더십 차원에서 필요한 이유다. [CEO 급여명세서]", "여러분들의 수고와 대가를 지불함이 헛되지 않음은 분명 시간의 흐름에 따라 자연스럽게 맺힐 열매로 확인될 것이다. [CEO 급여명세서]", "그 어려운 길에 함께 하는 여러분들이 이 특별한 미션과 도전, 그리고 의미를 통해 서로를 위로하고 격려하며 즐거운 여정이 되길 기원한다. [CEO 급여명세서]",
// ── 소셜이노베이터 책 추가 18개 ────────────────────────────
"역사를 전공했음에도 제대로 들어보지 못했던 역사를 경험하는 순간, 내가 아는 것과 인식하는 세계가 무척이나 제한된 세계라는 것을 깨달았다. [소셜이노베이터 책]", "소셜이노베이터가 반쯤 흥분한 상태로 느껴지는 이유가 있다. 자신이 문제라고 느끼는 주제에 뛰어들 때, 고통스러운 과정도 이들에게는 가슴 벅찬 경험이 되기 때문이다. [소셜이노베이터 책]", "\"관련 예산이 없어 고생 많은 것 다 알고 있어. 내 개인돈이니까 걱정하지 말고 필요한 곳에 마음껏 써.\" 진심 어린 한마디가 사람을 움직인다. [소셜이노베이터 책]", "현실이 규정하는 가능성의 범위에 머물지 말고, 적극적으로 가능한 범위를 찾아나서도록 격려해주는 리더야말로 소셜이노베이터의 전형적인 모습이다. [소셜이노베이터 책]", "지금 가진 시간과 지식, 자원을 충분히 나누고 있지 않다면 훗날 나눈다는 것은 불가능에 가깝다. 나눔은 미래가 아닌 지금 시작된다. [소셜이노베이터 책]", "사회적기업가정신이 가지고 있는 앞으로의 도전과제는 무엇일까? 유누스 교수의 답변은 우레와 같은 박수를 유도했다. [소셜이노베이터 책]", "다음은 국제적으로 유명한 키워드들이 공유하는 공통점은 무엇일까? 컴퓨터 운영체제, 공중보건 서비스, BRAC, 생태운동. 답은 오픈소스와 공유다. [소셜이노베이터 책]", "\"왜 꼭 영리와 비영리의 가치를 구분해서 접근해야 할까?\" 이 질문이 그라민은행을 만들었고 세상을 바꿨다. [소셜이노베이터 책]", "혁신적인 경영전략으로서의 사회적기업은 누구나 채택할 수 있지만 아무나 채택하지 못하는 희귀한 블루오션이다. [소셜이노베이터 책]", "기술을 중심으로 한 이노베이션은 삶의 변화를 이끄는 속도에 탁월하지만, 인류의 삶이 가야 할 방향에 대해서는 가치중립적이다. 방향을 정하는 것이 소셜이노베이터의 역할이다. [소셜이노베이터 책]", "잠수사의 원리를 적용해 잠수 쌀이라는 특별 품종이 탄생했다. 전혀 다른 분야의 지식을 연결하는 재조합, 그것이 소셜이노베이터의 무기다. [소셜이노베이터 책]", "문제를 기회로 바꾸어 볼 수만 있다면 소셜이노베이터는 일상적인 문제에서 특별한 기회를 만들어낼 수 있다. 당신 주변의 문제를 관찰해보라. [소셜이노베이터 책]", "민간토착적 이노베이션을 이루기 위해 소셜이노베이터는 전통과 문화에서 내려오는 지혜를 이해하고 주변의 긍정적 이탈을 관찰하는 역량을 키워야 한다. [소셜이노베이터 책]", "국제활동가란 자신이 가진 시간과 지식, 자원을 아낌없이 공유하는 사람이다. [소셜이노베이터 책]", "공감이 부족했다고 말하는 것은 쉽다. 그러나 직접 현장에서 이해관계자와 함께 해본 사람만이 진짜 공감이 무엇인지 알게 된다. [소셜이노베이터 책]", "BRAC은 세계 최대의 NGO가 되었다. 작은 질문 하나가 거대한 조직으로 성장하는 씨앗이 된다. [소셜이노베이터 책]", "시민참여형 예산편성(participatory budgeting)은 민주주의가 단순한 투표를 넘어 일상의 의사결정에 시민이 참여하는 것임을 보여준다. [소셜이노베이터 책]", "보다 많은 소셜이노베이터와 유엔이 함께 한다면 어떤 변화가 시작될 수 있을까? 나는 여전히 그 가능성을 기대하고 기다린다. [소셜이노베이터 책]",
// ── 임팩트 칼럼 추가 19개 ──────────────────────────────────
"SOVAC는 기업이 어떻게 경제적 가치와 사회적 가치를 함께 추구할 수 있을지 한국 사회에 요청하는 첫번째 공개적 질문이다. [임팩트 칼럼]", "해외 순방에서 대통령이 공식 참석한 행사가 사회적기업가정신이란 주제로 진행된 것은 단군 이래 처음이었을 것이다. [임팩트 칼럼]", "\"제주도 방언으로 배지근하다란 뜻이 무엇일까요?\" 지역의 언어 속에 담긴 지혜를 발견하는 것이 소셜이노베이션의 출발이다. [임팩트 칼럼]", "가장 지역적인 경험과 이야기가 가장 세계적인 경험과 이야기가 될 수 있기에, 언젠가는 뉴욕 브로드웨이에도 진출할 수 있지 않을까? [임팩트 칼럼]", "베네핏 코퍼레이션(비콥)은 미국 34개 주, 이탈리아, 콜롬비아 등에서 법제화됐다. 사회적 책임이 이제 법적 의무가 되는 시대다. [임팩트 칼럼]", "\"과테말라, 제주, 카카오.\" 세 가지의 이질적인 연결이 하나의 소셜벤처를 만들었다. 연결은 새로운 가치를 창출한다. [임팩트 칼럼]", "탄소배출권 가격 상승은 대기업에 수천억 원 대 영향을 끼친다. 기후는 이제 재무제표의 언어로 말하고 있다. [임팩트 칼럼]", "한국에너지기술평가원이 사회혁신형 에너지기업 지원을 새롭게 시작했다. 에너지 전환과 사회혁신이 만나는 지점이 새로운 기회다. [임팩트 칼럼]", "소비자의 작은 행동이 모이고 모이면 생명을 지킬 수 있고, 우리의 환경을 보다 건강하게 지킬 수 있다. 소비는 투표다. [임팩트 칼럼]", "영화에서 떡밥을 회수하듯, 임팩트 생태계에도 복선이 있다. 지금 뿌리는 씨앗이 언젠가 열매가 된다. [임팩트 칼럼]", "대표나 창업가의 삶이란 전쟁에 참여했지만 끝날 기미가 없는 전쟁을 해가면서도 개인의 삶은 지속하는 이중성이다. [임팩트 칼럼]", "MYSC의 소셜벤처 육성프로그램 설계와 구조를 차용하겠다는 연락이 왔다. 진정성 있는 모델은 자연스럽게 복제된다. [임팩트 칼럼]", "우리가 스스로 느끼는 것보다 더 민감하게, 고객과 파트너들은 MYSC답지 않음을 관찰하고 질문한다. [임팩트 칼럼]", "서강대 박사과정에서 MYSC 사내기업가 사례로 논문을 쓰겠다는 연락이 왔다. 우리의 실험이 누군가의 연구가 된다. [임팩트 칼럼]", "사이먼 사이넥의 무한게임 관점에서 보면, MYSC의 게임이 무한게임이라면 이 여정에 흥미를 잃지 않고 계속할 의지와 자원이 가장 중요하다. [임팩트 칼럼]", "공동체적 지원이 없다면 임팩트 비즈니스의 창업가도 고립된다. 생태계가 창업자를 키운다. [임팩트 칼럼]", "탄소가 미래 화폐가 된다는 것은 이제 예언이 아니라 현실이다. 기후위기는 투자 기회이기도 하다. [임팩트 칼럼]", "MYSC가 몸을 담고 있는 산업군은 제조업도 서비스업도 아닌 innovation이다. 그 불확실성이 우리의 업이다. [임팩트 칼럼]", "지리적으로도 후쿠오카는 서울, 부산, 상하이, 타이베이 등 동아시아 주요 도시들과 가까운 전략적 허브다. MYSC의 아시아 임팩트 여정은 계속된다. [임팩트 칼럼]",
// ── 칼럼 추가 12개 ──────────────────────────────────────────
"임팩트투자는 투자자만의 영역이 아니다. 소비자로서 내가 내리는 일상의 선택이 곧 임팩트투자가 된다. [더나은미래 칼럼]", "새로운 시대, 새로운 열매를 기대하기 위해서는 질문도 달라져야 한다. 성공할 수 있는 것이 아닌, 진짜 실패할 수 있을 만큼 무모하지만 혁신적인 것이 무엇인지 물어야 한다. [더나은미래 칼럼]", "사회(social)는 외부로 향하는 창문이자, 내부로 향하는 거울이다. 창문을 통해 사회와 상호작용하고, 거울을 통해 내부의 조직문화를 반영한다. [임팩트 칼럼]", "기존의 정체성을 유지한 채 해결책 도출에만 집중했던 과거의 문법에서 벗어난다면 우리는 새로운 변화를 맞을 수 있다. 당신의 정체성은 무엇이며, 새로운 문제 정의는 무엇인가? [더나은미래 칼럼]", "임팩트 시대가 왔다는 것을 알려주는 구체적인 신호 중 하나가 바로 임팩트투자다. 자본시장의 기후가 변화하고 있다. [더나은미래 칼럼]", "그 밖에 우리가 함께 꿈꿀 수 있는 더 나은 방향으로의 회복은 무엇이 있을까? 선행지표로 활동하는 혁신적인 스타트업들이 그 답을 보여준다. [더나은미래 칼럼]", "무인도 구조 게임은 사회문제 해결에 시사점을 준다. 문제 해결에 집중하기 전, 이 문제를 풀고자 하는 우리는 누구이며 어떻게 상호작용해야 하는가를 먼저 돌아봐야 한다. [더나은미래 칼럼]", "지난 13일 파리에서 열린 글로벌임팩트챕터(GIC). 세계를 다니다 보면 MYSC와 유사한 임팩트 부족을 종종 만나게 된다. [더나은미래 칼럼]", "보더리스재팬은 접근법은 다르지만 같은 방향을 바라보는 이란성 쌍둥이다. 이들과의 협력이 아시아 임팩트의 미래를 설계한다. [더나은미래 칼럼]", "MYSC는 성동임팩트펀드, 성동ESG펀드를 통해 지방정부와 협력했다. 신뢰가 먼저 오면 생태계가 만들어진다. [더나은미래 칼럼]", "이세돌이 반상에서 보여준 용기처럼, 우리 임팩트 생태계에서도 그런 한 수가 새로운 전환의 시작이 될지 모른다. [전남일보 칼럼]", "주주총회는 미래를 상상하는 자리다. 과거를 승인받는 자리가 아니라, 앞으로 어떤 신뢰 위에 설 것인지를 보여주는 자리여야 한다. [더나은미래 칼럼]",
// ── 기타 4개 ────────────────────────────────────────────────
"\"우리는 누구인가? MYSC는 줄곧 한 가지 정체성을 이야기해왔다. 바로 벤처생태계 빌더다.\" [더버터 2025.04]", "\"진짜 협력은 내가 모르는 것을 함께하는 용기에서 시작된다.\" [더나은미래 2025.03]", "\"앞으로 승리하는 조직은 여러 재즈 앙상블의 집합과 같을 것이다. 악보와 지휘자가 아닌, 상황과 호흡에 따라 음악이 달라진다.\" [임팩트 칼럼]", "\"사실 나 역시 무의식적인 고정관념에서 자유롭지 않다. 이런 실수를 통해 나 역시 아직 가야 할 길이 멀다는 것을 깨닫는다.\" [임팩트 칼럼]"];
